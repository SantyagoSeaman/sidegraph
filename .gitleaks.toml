title = "sidegraph gitleaks config"

# Extends gitleaks' default ruleset rather than replacing it.
[extend]
useDefault = true

# Path-scoped allowlist, never a global disable: every path below either belongs to the
# redaction feature's own test fixtures (deliberately shaped like a real credential so the
# redaction regexes in src/sidegraph/capture.py have something to catch — see
# tests/test_capture_redact.py's docstring), a design-plan doc quoting the same fixtures, or
# vendored third-party content we do not edit. A real secret anywhere else in the repo still
# fails the scan. This file ships to the public repo (tests/ ships wholesale with the same
# fixtures), so it has to hold there too.
[[allowlists]]
description = "Known-fake secrets in redaction-feature fixtures and vendored/planning content"
paths = [
  '''^tests/test_capture_redact\.py$''',
  '''^tests/test_redaction_seeded\.py$''',
  '''^tests/test_capture_propose\.py$''',
  '''^tests/test_capture_integration\.py$''',
  '''^tests/test_capture_facts\.py$''',
  '''^tests/test_importer\.py$''',
  '''^tests/test_doc_import\.py$''',
  '''^tests/test_domains\.py$''',
  '''^tests/test_server_capture\.py$''',
  '''^tests/test_server_domains\.py$''',
  '''^tests/test_server_facts\.py$''',
  '''^tests/test_server_redaction\.py$''',
  '''^design/superpowers/plans/2026-07-06-capture-ratification\.md$''',
  '''^design/superpowers/plans/2026-07-10-facts-layer\.md$''',
  '''^design/superpowers/reviews/2026-09-28-grok-whole-repo-review\.md$''',
  '''^src/sidegraph/viz/assets/vis-network\.min\.js$''',
]

# The 2026-11-06 and 2026-11-07 research packages record SHA-256 digests under keys such as
# task_key_sha256 and file paths such as src/sidegraph/redaction_tokens.py. The generic-api-key
# rule reads those as credentials (86 findings on the first commit attempt, all this rule, all
# digests or paths). Allowlisted for that one rule only; every other rule still scans them.
[[allowlists]]
description = "Digests and file names in the research packages read as generic API keys"
targetRules = ["generic-api-key"]
paths = [
  '''^design/reviews/2026-11-0[67]-[^/]+/''',
  # L2 bench results pin grading_key_sha256 and keys_sha256 (4 findings, all digests).
  '''^design/testing/benches/l2/results/[^/]+/result\.json$''',
  # Saved L0 reports pin canonical_sha256, task_key_sha256 and other digests.
  '''^design/testing/benches/l0/results/[^/]+\.json$''',
]

# The spec-replay kit's regression lists name tests by node id, and a few of those tests carry a
# fake PEM header, an example access key or a fake API key as a parameter. Allowlisted by line,
# only where the line names one of those tests by its full node id (a staged scan sees the line
# with a leading `+`, hence no anchor). A real secret anywhere else, or on any other line, still
# fails the scan. (`paths` is left out on purpose: gitleaks then skips the whole file.)
[[allowlists]]
description = "Node ids of tests whose parameters are fake keys, as listed by the spec-replay kit"
regexTarget = "line"
regexes = [
  '''tests/test_redaction_tokens\.py::test_pem_preserves_independent_header_grammar_and_first_end\[''',
  '''tests/test_capture_propose\.py::test_propose_all_secret_or_blank_initiative_binds_nothing\[AKIAQWERTYUIOPASDFGH\]''',
  '''tests/test_server_capture\.py::test_add_decision_all_secret_or_blank_initiative_binds_nothing\[AKIAQWERTYUIOPASDFGH\]''',
  '''tests/test_capture_redact\.py::test_redact_never_less_than_before_on_glued_quotes\[API_KEY = """sk_live_abc123"""-abc123\]''',
]
