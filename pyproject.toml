[project.urls]
Homepage = "https://github.com/SantyagoSeaman/sidegraph"
Repository = "https://github.com/SantyagoSeaman/sidegraph"
Documentation = "https://github.com/SantyagoSeaman/sidegraph/tree/main/docs"
Issues = "https://github.com/SantyagoSeaman/sidegraph/issues"
Changelog = "https://github.com/SantyagoSeaman/sidegraph/blob/main/CHANGELOG.md"

[project.scripts]
sidegraph-mcp = "sidegraph.host.mcp_entry:main"
sidegraph-session-start = "sidegraph.host.hooks:session_start"
sidegraph-stop = "sidegraph.host.hooks:stop"
sidegraph-pre-tool-use = "sidegraph.host.hooks:pre_tool_use"
sidegraph-subagent-start = "sidegraph.host.subagent:subagent_start"
sidegraph-init = "sidegraph.cli:init_main"
sidegraph-ratify = "sidegraph.cli:ratify_main"
sidegraph-sync = "sidegraph.cli:sync_main"
sidegraph-import = "sidegraph.cli:import_main"
sidegraph-domains = "sidegraph.cli:domains_main"
sidegraph-compact = "sidegraph.cli:compact_main"
sidegraph-migrate = "sidegraph.cli:migrate_main"
sidegraph-require = "sidegraph.cli:require_main"
sidegraph-verify = "sidegraph.cli:verify_main"
sidegraph-doctor = "sidegraph.cli:doctor_main"
sidegraph-stats = "sidegraph.cli:stats_main"
sidegraph-viz = "sidegraph.cli:viz_main"
sidegraph-export-okf = "sidegraph.cli:export_okf_main"
sidegraph-export-adr = "sidegraph.adr_cli:main"
sidegraph-bootstrap = "sidegraph.bootstrap.cli:main"
sidegraph-prepare-commit-msg = "sidegraph.cli:prepare_commit_msg_main"
sidegraph-blame = "sidegraph.cli:blame_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.13",
    "pyyaml>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidegraph"]
artifacts = [
  "src/sidegraph/viz/assets/vis-network.min.js",
  "src/sidegraph/viz/template.html",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# The whitepaper artifact bundle ships VERBATIM copies of the harness scripts that
# produced the published numbers, under a SHA-256 manifest — linting them would falsify
# both. Excluded here so a bare `ruff check .` agrees with the pre-commit config's
# exclude instead of contradicting it. (verify_public.py, the bundle-native script, is
# kept lint-clean by hand.)
extend-exclude = ["design/whitepaper/evidence/artifact-bundle"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
# tests/private is the release-only slow set: PR runs skip it, `pytest tests/private` runs it.
# Setting the option replaces pytest's defaults, so they are listed again.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "private"]
markers = [
    "integration: spawns real git repositories and subprocesses (release-script contract)",
    "slow: creates thousands of files or spawns subprocesses",
    "network: asks PyPI a question; skipped when pypi.org is unreachable",
]
# A passing test leaves no temp dir behind; a failing one keeps its dir for inspection.
tmp_path_retention_policy = "failed"

[tool.mypy]
python_version = "3.13"
files = ["src/sidegraph"]
plugins = ["pydantic.mypy"]
