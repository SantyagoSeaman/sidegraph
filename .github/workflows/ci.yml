# Project lint+type+test gate. `lint` runs the SAME .pre-commit-config.yaml a developer
# runs locally, so there is one definition of lint rather than a CI copy that drifts.
# Mostly distinct from the sidegraph-recipe workflows in docs/guides/ci-cd-maintenance.md
# (recipes for USER repos consuming Sidegraph) — except `store-lint`, which is Recipe 2
# self-applied to this repo's own dogfood store (2026-08-09 maintenance retrospective,
# cadence lever): the store rides every PR, so its transition rules should gate every PR.
#
# Actions are pinned to commit SHAs (the tag comment records the version): a mutable tag
# is a supply-chain hole, and this workflow ships to the public repo by snapshot.
# Draft PRs run lint, store-lint and anchor-health. Ready PRs, main pushes and
# workflow_call also run test, sdk-compatibility and windows-core. full-ci is the
# single required check. Ready pushes validate this revision against the full matrix.
# Draft runs use another name: a skipped job counts as success.
# A superseded PR run cannot provide a result for a newer revision.
# Rollback: disable the ruleset first, then revert this workflow through a PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:   # reused as the pre-publish gate by publish.yml (tag builds)

permissions:
  contents: read

# PR runs only: main, tag and workflow_call runs each get a unique group.
# This does not apply to session-link-gate.yml. Re-run only the head run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      # zizmor artipacked: this job never pushes, so the checkout's git credentials should not
      # persist into the runner's git config where a later step (or an uploaded artifact) could
      # leak them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # committed-history secret scan needs every reachable commit
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-ubuntu-slim-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Scan committed history for secrets
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          uv run pre-commit run gitleaks-history --hook-stage manual --all-files

      - name: Exercise secret scanner integration
        env:
          SIDEGRAPH_SECRET_SCAN_INTEGRATION: "1"
        run: |
          # The test file is release-only (tests/private); the public snapshot has no copy.
          if [ ! -f tests/private/test_secret_scan_gate.py ]; then
            echo "tests/private is not shipped here; scanner integration tests skipped"
            exit 0
          fi
          uv run pytest tests/private/test_secret_scan_gate.py -q --junitxml="$RUNNER_TEMP/secret-scan.xml"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(os.environ["RUNNER_TEMP"]) / "secret-scan.xml"
          suites = list(ElementTree.parse(report).getroot().iter("testsuite"))
          assert sum(int(s.attrib["tests"]) for s in suites) > 0, "no scanner tests ran"
          assert sum(int(s.attrib["skipped"]) for s in suites) == 0, "scanner tests skipped"
          PY

  test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      # zizmor artipacked: this job never pushes; do not persist git credentials past checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      # The Muse hook adapter runs on the stock macOS python3 (3.9); its test needs a 3.9 here.
      - name: Install Python 3.9 for the Muse adapter test
        run: |
          set -euo pipefail
          uv python install 3.9
          py39="$(uv python find --no-project 3.9)"
          "$py39" -c 'import sys; assert sys.version_info[:2] == (3, 9)'
          echo "SIDEGRAPH_TEST_PY39=$py39" >> "$GITHUB_ENV"

      - name: Run tests
        run: uv run pytest -q --durations=30 --durations-min=1

  sdk-compatibility:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Validate supported SDK bounds against installed wheel
        env:
          SDK_PAIR: ${{ matrix.sdk }}
        run: |
          uv build
          wheels=(dist/sidegraph-*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="$(realpath "${wheels[0]}")"
          probe="$(realpath tests/wheel_smoke.py)"
          environment="$RUNNER_TEMP/sidegraph-sdk-env"
          uv venv --python 3.13 "$environment"
          interpreter="$environment/bin/python"
          constraints=()
          if [ "$SDK_PAIR" = minimum ]; then
            constraints=(fastmcp==3.4.10 mcp==1.30.0)
          fi
          uv pip install --python "$interpreter" "$wheel" pytest "${constraints[@]}"
          mkdir -p "$RUNNER_TEMP/sdk-check"
          cp -R tests "$RUNNER_TEMP/sdk-check/tests"
          cd "$RUNNER_TEMP/sdk-check"
          "$interpreter" -I "$probe" --wheel "$wheel" --python "$interpreter"
          "$interpreter" -I -m pytest -q tests/test_server_result_contract.py \
            tests/test_server_argument_names.py tests/test_security_write_boundary.py \
            tests/test_security_mcp_write_diagnostics.py tests/test_server_invocation_policy.py
          "$interpreter" -I -m pytest -q tests/test_session_attribution.py \
            -k "not t9 and not t14_every and not t14_the_manual and not console_script_is_the_host_entry"

  windows-core:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      # Native core selection; Unix host/editor integrations remain covered on Linux.
      - name: Record native environment
        shell: pwsh
        run: |
          uv run python -c "import json,platform,importlib.metadata as m; print(json.dumps({'os':platform.system(),'python':platform.python_version(),'fastmcp':m.version('fastmcp'),'mcp':m.version('mcp')}))" > "$env:RUNNER_TEMP/windows-environment.json"
          exit $LASTEXITCODE

      - name: Test portable core and MCP contracts
        shell: pwsh
        run: |
          # Private acceptance files are absent from the public snapshot.
          $privateTests = @()
          if (Test-Path "tests/private/test_installed_wheel_smoke.py") {
            $privateTests += "tests/private/test_installed_wheel_smoke.py"
          }
          if (Test-Path "tests/private/test_older_reader_native.py") {
            $privateTests += "tests/private/test_older_reader_native.py"
          }
          uv run pytest -q --durations=30 --durations-min=1 --junitxml="$env:RUNNER_TEMP/windows-core.xml" `
            tests/test_store_mutation_guard.py `
            tests/test_store_mutation_immediate.py tests/test_store_cross_process_mutations.py `
            tests/test_hook_contention.py tests/test_retrieval_seeds.py `
            tests/test_portable_json.py tests/test_bootstrap_descriptor_cleanup.py `
            tests/test_server_result_contract.py tests/test_server_invocation_policy.py `
            tests/test_verify_git_stdin.py tests/test_seed_paths_portable.py `
            tests/test_verify_format2_snapshot.py `
            tests/test_store_format.py tests/test_store_rules.py `
            tests/test_maintenance_publish.py tests/test_migrate.py `
            tests/test_store_junctions.py tests/test_format2_windows.py `
            tests/test_repo_relative_paths_portable.py `
            tests/test_command_windows.py `
            tests/test_hook_payload_encoding.py tests/test_hook_failure_diagnostics.py `
            tests/test_hot_index_facts.py `
            tests/test_delivery_evidence.py tests/test_delivery_stats.py tests/test_delivery_surfaces.py `
            tests/test_git_output_utf8.py `
            tests/test_githooks_atomic_lock.py::test_windows_pid_probe_is_never_a_signal_from_python `
            tests/test_health_check_skill.py `
            tests/test_checkout_window.py tests/test_store_marker_checkout_race.py `
            $privateTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installed wheel over native stdio
        id: windows-wheel
        shell: pwsh
        env:
          WHEEL_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem dist/sidegraph-*.whl)
          if ($wheels.Count -ne 1) { throw "Expected one wheel artifact" }
          $wheel = $wheels[0].FullName
          $probe = (Resolve-Path tests/wheel_smoke.py).Path
          $environment = Join-Path $env:RUNNER_TEMP "sidegraph-wheel-env"
          uv venv --python "$env:WHEEL_PYTHON_VERSION" "$environment"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $interpreter = Join-Path $environment "Scripts/python.exe"
          uv pip install --python "$interpreter" "$wheel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location "$env:RUNNER_TEMP"
          & "$interpreter" -I "$probe" --wheel "$wheel" --python "$interpreter" |
            Tee-Object -FilePath "$env:RUNNER_TEMP/windows-wheel.json"
          exit $LASTEXITCODE

      # Preserve the primary failure. Instrumentation uses new no-graph/no-repo scratch.
      - name: Diagnose first installed-wheel write
        if: ${{ !cancelled() && steps.windows-wheel.outcome == 'failure' }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist/sidegraph-*.whl)
          if ($wheels.Count -ne 1) { throw "Expected one wheel artifact" }
          $wheel = $wheels[0].FullName
          $probe = (Resolve-Path tests/wheel_smoke.py).Path
          $interpreter = Join-Path $env:RUNNER_TEMP "sidegraph-wheel-env/Scripts/python.exe"
          Set-Location "$env:RUNNER_TEMP"
          & "$interpreter" -I "$probe" --wheel "$wheel" --python "$interpreter" `
            --diagnose-first-write
          exit $LASTEXITCODE

      - name: Sanitize test report
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'windows-core.xml'
          if report.exists():
              tree = ET.parse(report)
              for element in tree.getroot().iter():
                  if element.tag in {'failure', 'error', 'skipped', 'system-out', 'system-err'}:
                      element.attrib.clear()
                      element.text = 'Details omitted; see the CI step output.'
                  element.attrib.pop('file', None)
                  element.attrib.pop('hostname', None)
              tree.write(report, encoding='utf-8', xml_declaration=True)
          '@ | uv run python -
          exit $LASTEXITCODE

      - name: Upload bounded Windows evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-core-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/windows-core.xml
            ${{ runner.temp }}/windows-environment.json
            ${{ runner.temp }}/windows-wheel.json
          if-no-files-found: warn
          retention-days: 7

  # Recipe 2 (docs/guides/ci-cd-maintenance.md) on our own store: catch a hand-edited or
  # history-rewritten record no MCP tool would produce. Diffs against the PR's merge base
  # (never a moving branch name — see the recipe for why). Skips cleanly when the checkout
  # carries no store: the public snapshot ships .sidegraph only on the demo branch, and
  # this workflow ships to the public repo.
  store-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # zizmor artipacked: this job never pushes; do not persist git credentials past checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history — merge-base needs it
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: sidegraph-verify --against merge-base
        run: |
          if [ ! -d .sidegraph ]; then
            echo "no .sidegraph in this checkout — store lint not applicable"
            exit 0
          fi
          uv sync --locked
          base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          uv run sidegraph-verify --against "$base" --json

  # Recipe 1 self-applied: rebuild the graph from scratch and fail on attention findings
  # (stale decisions, empty/overbroad domains, slug conflicts, refresh failures). A
  # cache-less rebuild was verified label-identical to the local cached graph and the
  # check green on it (2026-08-09 retrospective, cadence lever) — so a red here is a real
  # finding, not CI-environment noise. Lone orphaned/ambiguous entities do NOT fail the
  # check: multi-anchor tolerates them by design. The engine is version-pinned (engine-
  # seam invariant); the sync writes only to the ephemeral checkout's .sidegraph/.
  anchor-health:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # zizmor artipacked: this job never pushes; do not persist git credentials past checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Rebuild graph and run sidegraph-sync --check
        env:
          GRAPHIFY_NO_AUTO_REFRESH: "1"
          PYTHONHASHSEED: "0"
          GRAPHIFY_MAX_WORKERS: "1"
        run: |
          if [ ! -d .sidegraph ]; then
            echo "no .sidegraph in this checkout — anchor health not applicable"
            exit 0
          fi
          uvx --from graphifyy==0.9.90 graphify update .
          uv sync --locked
          uv run sidegraph-sync --json --check

  full-ci:
    name: "${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && 'full-ci' || 'full-ci (draft: full matrix not run)' }}"
    if: ${{ always() }}
    needs: [lint, test, sdk-compatibility, windows-core, store-lint, anchor-health]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed on this revision
        env:
          FULL: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
          EVENT: ${{ github.event_name }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          SDK: ${{ needs.sdk-compatibility.result }}
          WINDOWS: ${{ needs.windows-core.result }}
          STORE_LINT: ${{ needs.store-lint.result }}
          ANCHOR_HEALTH: ${{ needs.anchor-health.result }}
        run: |
          status=0
          need() {  # need <job> <result> <allowed...>
            job="$1"; result="$2"; shift 2
            for ok in "$@"; do [ "$result" = "$ok" ] && return 0; done
            echo "::error::$job: '${result:-none}' (needs: $*)"; status=1
          }
          if [ "$FULL" != true ]; then
            echo "::notice::Draft pull request: the full matrix did not run. Mark it Ready; the required check is full-ci."
            need lint "$LINT" success
            need store-lint "$STORE_LINT" success
            need anchor-health "$ANCHOR_HEALTH" success
            exit "$status"
          fi
          need lint "$LINT" success
          need test "$TEST" success
          need sdk-compatibility "$SDK" success
          need windows-core "$WINDOWS" success
          if [ "$EVENT" = pull_request ]; then
            need store-lint "$STORE_LINT" success
            need anchor-health "$ANCHOR_HEALTH" success
          else
            need store-lint "$STORE_LINT" success skipped
            need anchor-health "$ANCHOR_HEALTH" success skipped
          fi
          exit "$status"
